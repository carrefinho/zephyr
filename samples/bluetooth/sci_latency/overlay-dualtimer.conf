# DUAL-TIMER A/B arm. Flips the nRF54L controller from the single-TIMER10
# architecture (EVENT_TIMER and SW_SWITCH_TIMER share NRF_TIMER10) to the
# dual-timer architecture (EVENT_TIMER = NRF_TIMER00 in the MCU power domain,
# SW_SWITCH_TIMER = NRF_TIMER10 in the Radio domain, bridged by PPIB). In
# dual-timer mode radio_nrf5_resources.h drops HAL_RADIO_ISR_LATENCY_MAX_US from
# 80 us to 0 -- the per-event overhead hypothesised as a cause of the measured
# ECV floor. This overlay is the timer-architecture variable, orthogonal to the
# test mode: stack it LAST onto any central or peripheral build to run its arm.
#
#   -DEXTRA_CONF_FILE="central.conf;mode_ecv_load.conf;overlay-dualtimer.conf"
#   -DEXTRA_CONF_FILE="peripheral.conf;overlay-dualtimer.conf"
#
# BT_CTLR_ADVANCED_FEATURES makes BT_CTLR_SW_SWITCH_SINGLE_TIMER assignable; the
# Kconfig no longer force-selects single-timer on nRF54L, so =n here sticks and
# selects the NRF_TIMER00 EVENT_TIMER dual-timer path.
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_SW_SWITCH_SINGLE_TIMER=n
