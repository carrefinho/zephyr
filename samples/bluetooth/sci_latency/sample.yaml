sample:
  name: SCI latency tester (nRF54L15 DK, hardware-in-the-loop)
  description: >
    Two-DK Shorter Connection Intervals latency tester. The central drives a
    1.25 ms link via the Connection Rate Update procedure and sweeps the subrate
    factor, logging round-trip GATT latency over the VCOM UART.
common:
  tags: bluetooth sci subrating
  harness: bluetooth
tests:
  sample.bluetooth.sci_latency.central:
    build_only: true
    extra_args: EXTRA_CONF_FILE=central.conf
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf52_bsim
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp
  sample.bluetooth.sci_latency.peripheral:
    build_only: true
    extra_args: EXTRA_CONF_FILE=peripheral.conf
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf52_bsim
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp
  sample.bluetooth.sci_latency.ecv_sweep:
    build_only: true
    extra_args: EXTRA_CONF_FILE=ecv_sweep.conf
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf52_bsim
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp
  sample.bluetooth.sci_latency.fsu_swap:
    build_only: true
    extra_args: EXTRA_CONF_FILE="central.conf;mode_fsu_swap.conf"
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp
  sample.bluetooth.sci_latency.ecv_load:
    build_only: true
    extra_args: EXTRA_CONF_FILE="central.conf;mode_ecv_load.conf"
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp
  sample.bluetooth.sci_latency.ecv_load_dualtimer:
    build_only: true
    extra_args: EXTRA_CONF_FILE="central.conf;mode_ecv_load.conf;overlay-dualtimer.conf"
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp
  sample.bluetooth.sci_latency.peripheral_dualtimer:
    build_only: true
    extra_args: EXTRA_CONF_FILE="peripheral.conf;overlay-dualtimer.conf"
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp
