# Common config for both roles.
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="sci_lat"
CONFIG_LOG=y

# Shorter Connection Intervals (RCV tier). Depends on the LL Extended Feature
# Set (SCI feature bits are on page 1) and Connection Subrating (subrate params
# are fused into the Connection Rate procedure). The split LL_SW controller picks
# up CONFIG_BT_CTLR_SHORTER_CONNECTION_INTERVALS by default from the host symbol.
CONFIG_BT_LE_EXTENDED_FEAT_SET=y
CONFIG_BT_LE_MAX_LOCAL_SUPPORTED_FEATURE_PAGE=1
CONFIG_BT_SUBRATING=y
CONFIG_BT_SHORTER_CONNECTION_INTERVALS=y
