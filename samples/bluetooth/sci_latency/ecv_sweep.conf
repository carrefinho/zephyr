# ECV interval-sweep Central: starting just below RCV 1.25 ms, drives the link
# down the ECV band {1125,1000,875,750,625,500,375} us at subrate factor 1 and
# logs round-trip GATT latency at each, stopping at the first interval the silicon
# cannot sustain (the HW floor, wherever it is). Pair with a peripheral.conf DK.
# Build:  west build -b nrf54l15dk/nrf54l15/cpuapp -- -DEXTRA_CONF_FILE=ecv_sweep.conf
CONFIG_SCI_LATENCY_CENTRAL=y
CONFIG_SCI_LATENCY_ECV_SWEEP=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_GATT_CLIENT=y
