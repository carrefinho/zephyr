# MODE_ECV_LOAD: drive the link to an ECV interval (default 750 us), request 2M
# PHY, optionally negotiate FSU (AFTER the conn-rate change -- the conn-rate
# apply resets tIFS to 150 us, so an earlier FSU would be undone; ull_conn.c:2784),
# then soak the ZMK-split pointing load (one 8-byte notification per interval),
# counting delivered vs OFFERED and sequence gaps. The load-bearing HW re-test of
# the empty-PDU floor sweep.
#
# Stack onto central.conf:
#   -DEXTRA_CONF_FILE="central.conf;mode_ecv_load.conf"
# Pick the interval / FSU-on-off / soak via menuconfig or extra -D flags:
#   -DCONFIG_SCI_LATENCY_ECV_INTERVAL_125US=5   (625 us)
#   -DCONFIG_SCI_LATENCY_ECV_FSU=n              (150 us tIFS control run)
CONFIG_SCI_LATENCY_MODE_ECV_LOAD=y

# Shorter Connection Intervals (ECV tier) + Frame Space Update, composed in one
# controller build: the same load runs with and without the FSU negotiation, so
# the FSU-on gate vs the FSU-off control is the airtime-vs-scheduler discriminator.
CONFIG_BT_FRAME_SPACE_UPDATE=y
CONFIG_BT_CTLR_FRAME_SPACE_UPDATE=y
CONFIG_BT_CTLR_FSU_MIN_FRAME_SPACE_US=80

# Open the ECV floor for the probe builds so the controller accepts sub-625 us
# requests (all three enforcement sites key off this one symbol). PRODUCTION
# DEFAULT IS UNTOUCHED (5 = 625 us, the measured nRF54L15 single-timer floor);
# this is a probe-build-only relaxation to the Core 6.2 spec floor (3 = 375 us).
CONFIG_BT_CTLR_SCI_ECV_INTERVAL_MIN_125US=3

# Below the validated floor the ticker may decide an event would start late; skip
# it gracefully instead of asserting, so the skip shows up as a delivered-rate
# shortfall (what the 90% gate and the interim/final RESULT lines measure) rather
# than a controller assert. BT_CTLR_ADVANCED_FEATURES makes the symbol assignable.
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n

# Controller test hooks (read by the central for the CE-count context): per-conn
# event counter and slot reservation. Not for production; guarded in the source.
CONFIG_BT_CTLR_TEST_CONN_EVENT_COUNT=y
CONFIG_BT_CTLR_TEST_CONN_TICKS_SLOT=y

# The loaded matrix ran on 2M PHY (what a real ZMK split link negotiates and what
# Nordic documents its 750 us floor against). The central requests 2M via
# bt_conn_le_phy_update; the callback needs BT_USER_PHY_UPDATE (selected by the
# mode). 2M PHY support (BT_CTLR_PHY_2M) is default y on nRF54L; explicit here.
CONFIG_BT_CTLR_PHY_2M=y
