# Turn the controller's prepare-latency check into a graceful event skip
# instead of a kernel oops (LL_ASSERT_OVERHEAD in lll_peripheral.c prepare_cb).
# At sub-750 us ECV intervals the nRF54L single-timer 80 us ISR dead-zone can
# transiently exceed EVENT_OVERHEAD_START_US (observed at the conn-rate apply
# instant); skipping that one event is harmless, asserting is fatal.
# ASSERT_OVERHEAD_START's prompt is `visible if BT_CTLR_ADVANCED_FEATURES`;
# without the gate the =n assignment is SILENTLY ignored (default y wins).
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n
# Done-extra pool: default 4 exhausts at sub-625us ECV intervals (evdone assert,
# lll.c:562) -- same wall the bsim probe found; 12 = the probe-validated sizing.
CONFIG_BT_CTLR_EVENT_DONE_MAX=12
