# MODE_FSU_SWAP: isolate the Frame Space Update inter-frame-space swap (Core 6.2
# 5.1.30.1) from ECV interval timing. On a quiescent 7.5 ms link, negotiate FSU
# 150 -> floor (80 us) -> 150 with periodic reads across each direction, proving
# the swap never drops a packet on a real radio. The bench is the FIRST OTA test
# of the naive apply (no transitional RX-window widening).
#
# Stack onto central.conf:
#   -DEXTRA_CONF_FILE="central.conf;mode_fsu_swap.conf"
CONFIG_SCI_LATENCY_MODE_FSU_SWAP=y

# Frame Space Update: host API (bt_conn_le_frame_space_update + the
# frame_space_updated callback) and the controller-side procedure. FSU has no
# host feature-support bit (LL bit 65 is Host-Controlled=N); the controller
# advertises it and applies autonomously. The feature bit is on LL page 1, which
# prj.conf already enables (BT_LE_EXTENDED_FEAT_SET + page 1).
CONFIG_BT_FRAME_SPACE_UPDATE=y
CONFIG_BT_CTLR_FRAME_SPACE_UPDATE=y

# Controller frame-space floor the responder clamps to and the initiator reports
# (HW-measurable, like the ECV interval floor). A request below this floor is
# granted as exactly this value; the swap mode reports the negotiated frame_space.
CONFIG_BT_CTLR_FSU_MIN_FRAME_SPACE_US=80
