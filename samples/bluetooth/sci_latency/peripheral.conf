# Peripheral role: advertises and accepts the central's SCI + subrate changes,
# responds to Frame Space Update as the responder, and hosts the ZMK-split load
# characteristic (streams one 8-byte notification per connection interval while
# subscribed, for the ECV_LOAD mode). One image serves every mode -- no build
# variation beyond this file.
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_BROADCASTER=y

# Frame Space Update responder. No host feature-support bit (LL bit 65 is
# Host-Controlled=N); the controller advertises it and answers the peer's
# LL_FRAME_SPACE_REQ autonomously, clamping to its configured floor.
CONFIG_BT_FRAME_SPACE_UPDATE=y
CONFIG_BT_CTLR_FRAME_SPACE_UPDATE=y
CONFIG_BT_CTLR_FSU_MIN_FRAME_SPACE_US=80

# Host TX headroom for a sustained one-notification-per-CE stream at sub-ms
# intervals (default is 3 ACL TX buffers). Backpressure would surface as
# bt_gatt_notify -ENOMEM -- a rate shortfall the central measures, not a fake gap.
CONFIG_BT_BUF_ACL_TX_COUNT=8

