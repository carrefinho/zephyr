# Plain subrate at 30 ms -- matches the conn_subrate bsim test (CONN_INTERVAL_UNITS
# = 24, burst reads 50 ms apart) for a direct HW-vs-bsim comparison. bsim reports
# factor-8 continuation burst min ~40 ms; if HW matches, the ~98 ms floor seen at
# 1.25/7.5 ms is a sub-30 ms-interval effect, not a bsim-vs-silicon divergence.
CONFIG_SCI_LATENCY_CENTRAL=y
CONFIG_SCI_LATENCY_PLAIN_SUBRATE=y
CONFIG_SCI_LATENCY_PLAIN_INTERVAL_UNITS=24
CONFIG_SCI_LATENCY_IDLE_GAP_MS=400
CONFIG_SCI_LATENCY_BURST_GAP_MS=50
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_GATT_CLIENT=y
