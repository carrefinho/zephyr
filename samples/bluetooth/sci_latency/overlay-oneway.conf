# One-way notification latency via a DK-to-DK cross-wire: P1.11 <-> P1.11 + GND.
# Stack onto BOTH builds: the peripheral marks each load-stream event on the pin,
# the ECV_LOAD central GPIOTE-timestamps the edge and its own delivery callback
# on one local clock -- a one-way figure with no external instrument.
CONFIG_SCI_LATENCY_GPIO_ONEWAY=y
