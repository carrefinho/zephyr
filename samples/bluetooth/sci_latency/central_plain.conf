# Control build: plain subrating at 7.5 ms, NO SCI / Connection Rate Update.
# Isolates the original subrating path from the SCI/1.25 ms interaction. Same
# binary otherwise as central.conf; flash this onto the central DK to compare.
CONFIG_SCI_LATENCY_CENTRAL=y
CONFIG_SCI_LATENCY_PLAIN_SUBRATE=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_GATT_CLIENT=y
