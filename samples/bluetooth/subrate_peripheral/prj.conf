CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="subrate_demo"

# LE Connection Subrating: enabling it sets the Host Support feature bit so the
# central may drive the factor, and the controller applies the negotiated skip.
CONFIG_BT_SUBRATING=y
CONFIG_BT_CTLR_SUBRATING=y

# Keep the central's connection interval (don't auto-request preferred params,
# which would change the interval and reset subrating mid-demo).
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n

# LED (state).
CONFIG_GPIO=y
