# Low-power measurement overlay: no UART/SERIAL/console so the SoC reaches its
# deepest sleep between (subrated) events and the measured current reflects only
# BLE/subrating activity. The factor still auto-cycles on the timer and the LED
# still blinks the tier index (1/2/3) at each change, so the tiers remain
# identifiable in a current trace. Apply with -DEXTRA_CONF_FILE=lowpower.conf.
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_PRINTK=n
