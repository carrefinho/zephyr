CONFIG_BT=y
CONFIG_BT_CENTRAL=y

# LE Connection Subrating: host API (bt_conn_le_subrate_request) + Host Support
# feature bit, and the controller-side negotiation + event skipping.
CONFIG_BT_SUBRATING=y
CONFIG_BT_CTLR_SUBRATING=y

# Keep the connection interval fixed so the subrate skip cadence is stable while
# measuring current at each factor tier.
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n

# Console (printk) on the on-board VCOM UART, captured over the J-Link USB
# serial port - reliable for autonomous, scripted capture.
CONFIG_UART_CONSOLE=y

# LED (tier indication).
CONFIG_GPIO=y
