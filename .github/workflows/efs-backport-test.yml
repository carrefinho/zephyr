# CI for the Extended Feature Set host backport (step 1 of the SCI/FSU work).
#
# Compile-checks the backported host EFS code via the upstream-provided twister
# scenario `bluetooth.shell.extended_feature_set` (build_only, BT_LL_SW_SPLIT=n,
# so host-only: it compiles the host EFS path without needing controller support,
# which is still greenfield). native_sim => fast host build, no SDK cross-compile.
#
# The existing "Subrating Tests" workflow runs in parallel on this branch as a
# regression check: it builds the modified host files with EFS #if'd out and runs
# the subrating bsim suite, catching any breakage in the always-compiled additions
# (feature-bit defines, the new bt_conn feature-pages field, Kconfig).
name: Extended Feature Set Backport

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  efs-host-compile:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/zephyrproject-rtos/ci-base:v0.29.1
      options: "--entrypoint /bin/bash"
    steps:
      - name: Apply container owner mismatch workaround
        run: git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve west topdir
        run: echo "WEST_TOPDIR=$(realpath "$GITHUB_WORKSPACE/..")" >> "$GITHUB_ENV"

      - name: Cache west modules
        uses: actions/cache@v5
        env:
          cache-name: cache-zephyr-modules-v2
        with:
          path: |
            ${{ env.WEST_TOPDIR }}/modules
            ${{ env.WEST_TOPDIR }}/tools
            ${{ env.WEST_TOPDIR }}/bootloader
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
        timeout-minutes: 5
        continue-on-error: true

      - name: West init + update
        run: |
          west init -l . || true
          west config manifest.group-filter -- +ci,+optional
          west config --global update.narrow true
          west update 1> west.update.log 2>&1
          west forall -c 'git reset --hard HEAD'
          echo "ZEPHYR_SDK_INSTALL_DIR=/opt/toolchains/zephyr-sdk-$(cat SDK_VERSION)" >> "$GITHUB_ENV"

      # ci-base ships no Zephyr SDK; the host toolchain also satisfies
      # CMake's FindZephyr-sdk for native_sim builds.
      - name: Install Zephyr SDK (host toolchain only)
        run: west sdk install -b /opt/toolchains -t x86_64-zephyr-elf

      - name: Build host Extended Feature Set (twister, native_sim, build-only)
        run: |
          export ZEPHYR_BASE="${PWD}"
          export ZEPHYR_TOOLCHAIN_VARIANT=zephyr
          ./scripts/twister -p native_sim \
            -T tests/bluetooth/shell -s bluetooth.shell.extended_feature_set \
            --inline-logs -v -N --no-detailed-test-id

      - name: Upload twister output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: efs-twister-out
          path: |
            twister-out/twister.log
            twister-out/**/build.log
          if-no-files-found: ignore

  # Compile the CONTROLLER-side EFS code in a real LL_SW build (nrf52_bsim),
  # which the host-only shell EFS test above does not exercise. Build-only:
  # turns CONFIG_BT_CTLR_EXTENDED_FEAT_SET on via the overlay and confirms the
  # controller EFS additions compile. The Subrating Tests workflow covers the
  # EFS-off regression in parallel.
  efs-controller-compile:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/zephyrproject-rtos/ci-base:v0.29.1
      options: "--entrypoint /bin/bash"
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
    steps:
      - name: Apply container owner mismatch workaround
        run: git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve west topdir
        run: echo "WEST_TOPDIR=$(realpath "$GITHUB_WORKSPACE/..")" >> "$GITHUB_ENV"

      - name: Cache west modules
        uses: actions/cache@v5
        env:
          cache-name: cache-zephyr-modules-v2
        with:
          path: |
            ${{ env.WEST_TOPDIR }}/modules
            ${{ env.WEST_TOPDIR }}/tools
            ${{ env.WEST_TOPDIR }}/bootloader
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
        timeout-minutes: 5
        continue-on-error: true

      - name: West init + update
        run: |
          west init -l . || true
          west config manifest.group-filter -- +ci,+optional,+babblesim
          west config --global update.narrow true
          west update 1> west.update.log 2>&1
          west forall -c 'git reset --hard HEAD'
          echo "ZEPHYR_SDK_INSTALL_DIR=/opt/toolchains/zephyr-sdk-$(cat SDK_VERSION)" >> "$GITHUB_ENV"

      # ci-base ships no Zephyr SDK or pre-built BabbleSim (the full ci image
      # no longer fits GitHub-hosted runner disks); install the host toolchain
      # and build bsim from the west babblesim group (cached under tools/).
      - name: Install Zephyr SDK (host toolchain only)
        run: west sdk install -b /opt/toolchains -t x86_64-zephyr-elf

      - name: Build BabbleSim
        run: |
          # A restored cache can carry component dirs dropped from the
          # manifest (e.g. 4.1-era ext_2G4_device_playbackv2); they abort
          # the bsim build, so drop any component without a Depends file.
          # components/common is shared make infra (the top-level Makefile
          # is a symlink into it) and legitimately has no Depends -- keep it.
          for d in "${WEST_TOPDIR}"/tools/bsim/components/*/; do
            case "$d" in */common/) continue ;; esac
            [ -e "${d}Depends" ] || { echo "removing stale bsim component ${d}"; rm -rf "${d}"; }
          done
          make -C "${WEST_TOPDIR}/tools/bsim" everything -j"$(nproc)"
          test -f "${WEST_TOPDIR}/tools/bsim/lib/bs_2G4_phy_v1.version"
          echo "BSIM_OUT_PATH=${WEST_TOPDIR}/tools/bsim/" >> "$GITHUB_ENV"
          echo "BSIM_COMPONENTS_PATH=${WEST_TOPDIR}/tools/bsim/components" >> "$GITHUB_ENV"

      - name: Compile controller with Extended Feature Set ON (nRF52, build-only)
        shell: bash
        run: |
          export ZEPHYR_BASE="${PWD}"
          source tests/bsim/compile.source
          conf_overlay="${ZEPHYR_BASE}/tests/bsim/bluetooth/ll/conn_subrate/overlay-efs.conf" \
            app=tests/bsim/bluetooth/ll/conn_subrate compile
          wait_for_background_jobs

      - name: Run Feature Page Exchange scenario (nRF52 bsim)
        shell: bash
        run: |
          export ZEPHYR_BASE="${PWD}"
          export EXECUTE_TIMEOUT=120
          tests/bsim/bluetooth/ll/conn_subrate/tests_scripts/conn_efs.sh
