# CI for the Shorter Connection Intervals (SCI) CONTROLLER (RCV tier).
#
# Compile-checks the controller-side SCI code in a real LL_SW build (nrf52_bsim)
# by turning CONFIG_BT_CTLR_SHORTER_CONNECTION_INTERVALS on via the overlay and
# confirming the additions compile + link. Build-only while the procedure FSM,
# HCI backends, and bsim test are landed incrementally; the end-to-end
# Connection Rate run is added to this job in the test step.
#
# The Subrating and Extended Feature Set workflows run in parallel as the
# SCI-off regression (the always-compiled feature-bit defines, the ctx data
# union member, Kconfig).
name: Shorter Connection Intervals Controller

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  sci-controller-compile:
    runs-on: ubuntu-22.04
    container:
      image: docker.io/zephyrprojectrtos/ci:v0.27.4
      options: "--entrypoint /bin/bash"
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
      BSIM_OUT_PATH: /opt/bsim/
      BSIM_COMPONENTS_PATH: /opt/bsim/components
    steps:
      - name: Apply container owner mismatch workaround
        run: git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve west topdir
        run: echo "WEST_TOPDIR=$(realpath "$GITHUB_WORKSPACE/..")" >> "$GITHUB_ENV"

      - name: Cache west modules
        uses: actions/cache@v5
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            ${{ env.WEST_TOPDIR }}/modules
            ${{ env.WEST_TOPDIR }}/tools
            ${{ env.WEST_TOPDIR }}/bootloader
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
        timeout-minutes: 5
        continue-on-error: true

      - name: West init + update
        run: |
          west init -l . || true
          west config manifest.group-filter -- +ci,+optional
          west config --global update.narrow true
          west update 1> west.update.log 2>&1
          west forall -c 'git reset --hard HEAD'
          echo "ZEPHYR_SDK_INSTALL_DIR=/opt/toolchains/zephyr-sdk-$(cat SDK_VERSION)" >> "$GITHUB_ENV"

      - name: Compile controller with Shorter Connection Intervals ON (nRF52)
        shell: bash
        run: |
          export ZEPHYR_BASE="${PWD}"
          source tests/bsim/compile.source
          conf_overlay="${ZEPHYR_BASE}/tests/bsim/bluetooth/ll/conn_subrate/overlay-sci.conf" \
            app=tests/bsim/bluetooth/ll/conn_subrate compile
          wait_for_background_jobs

      # Build-only: co-enable the CIS (ISO) and PAST controller code with SCI so
      # the ECV-reject guards in those paths (ll_cis_create_check, rp_cc CIS-req,
      # ull_cp_periodic_sync, PAST receive) stay on the compile path and do not
      # bit-rot. Not run -- conn_subrate does not exercise ISO/PAST at runtime.
      - name: Compile controller with SCI + ISO + PAST co-enabled (ECV-guard compile-check, nRF52)
        shell: bash
        run: |
          export ZEPHYR_BASE="${PWD}"
          source tests/bsim/compile.source
          conf_overlay="${ZEPHYR_BASE}/tests/bsim/bluetooth/ll/conn_subrate/overlay-sci.conf;${ZEPHYR_BASE}/tests/bsim/bluetooth/ll/conn_subrate/overlay-sci-iso.conf" \
            app=tests/bsim/bluetooth/ll/conn_subrate compile
          wait_for_background_jobs

      # Compile the Frame Space Update (FSU) controller + host code with
      # CONFIG_BT_FRAME_SPACE_UPDATE=y. The conn_fsu.sh run step below exercises
      # the full HCI 0x209D -> LL_FRAME_SPACE_REQ/RSP -> 0x35 event path against
      # this build.
      - name: Compile controller with Frame Space Update ON (nRF52)
        shell: bash
        run: |
          export ZEPHYR_BASE="${PWD}"
          source tests/bsim/compile.source
          conf_overlay="${ZEPHYR_BASE}/tests/bsim/bluetooth/ll/conn_subrate/overlay-fsu.conf" \
            app=tests/bsim/bluetooth/ll/conn_subrate compile
          wait_for_background_jobs

      - name: Run the Connection Rate Update scenario (nRF52 bsim)
        shell: bash
        run: |
          export ZEPHYR_BASE="${PWD}"
          export EXECUTE_TIMEOUT=120
          tests/bsim/bluetooth/ll/conn_subrate/tests_scripts/conn_sci.sh

      - name: Run the Connection Rate + subrating scenario (nRF52 bsim)
        shell: bash
        run: |
          export ZEPHYR_BASE="${PWD}"
          export EXECUTE_TIMEOUT=180
          tests/bsim/bluetooth/ll/conn_subrate/tests_scripts/conn_sci_subrate.sh

      - name: Run the Connection Rate coexistence scenarios (RCV + ECV, nRF52 bsim)
        shell: bash
        run: |
          export ZEPHYR_BASE="${PWD}"
          export EXECUTE_TIMEOUT=180
          tests/bsim/bluetooth/ll/conn_subrate/tests_scripts/conn_sci_coex.sh
          tests/bsim/bluetooth/ll/conn_subrate/tests_scripts/conn_ecv_coex.sh

      - name: Run the SCI instant-collision + one-way latency scenarios (nRF52 bsim)
        shell: bash
        run: |
          export ZEPHYR_BASE="${PWD}"
          export EXECUTE_TIMEOUT=120
          tests/bsim/bluetooth/ll/conn_subrate/tests_scripts/conn_sci_collision.sh
          tests/bsim/bluetooth/ll/conn_subrate/tests_scripts/conn_sci_latency.sh

      - name: Run the Frame Space Update scenario (nRF52 bsim)
        shell: bash
        run: |
          export ZEPHYR_BASE="${PWD}"
          export EXECUTE_TIMEOUT=120
          tests/bsim/bluetooth/ll/conn_subrate/tests_scripts/conn_fsu.sh

  # Same SCI scenarios on the nRF54L15 bsim target -- the primary ZMK SoC. nRF54L
  # uses a single radio timer; the sub-7.5 ms RCV interval stresses the event
  # overhead check that the in-tree single-timer fixes (6e8f081385e/e94d9c78117,
  # already on the base) address. BOARD drives both the build and the test
  # scripts (BOARD_TS is derived from it).
  sci-controller-nrf54l:
    runs-on: ubuntu-22.04
    container:
      image: docker.io/zephyrprojectrtos/ci:v0.27.4
      options: "--entrypoint /bin/bash"
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
      BSIM_OUT_PATH: /opt/bsim/
      BSIM_COMPONENTS_PATH: /opt/bsim/components
      BOARD: nrf54l15bsim/nrf54l15/cpuapp
    steps:
      - name: Apply container owner mismatch workaround
        run: git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve west topdir
        run: echo "WEST_TOPDIR=$(realpath "$GITHUB_WORKSPACE/..")" >> "$GITHUB_ENV"

      - name: Cache west modules
        uses: actions/cache@v5
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            ${{ env.WEST_TOPDIR }}/modules
            ${{ env.WEST_TOPDIR }}/tools
            ${{ env.WEST_TOPDIR }}/bootloader
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
        timeout-minutes: 5
        continue-on-error: true

      - name: West init + update
        run: |
          west init -l . || true
          west config manifest.group-filter -- +ci,+optional
          west config --global update.narrow true
          west update 1> west.update.log 2>&1
          west forall -c 'git reset --hard HEAD'
          echo "ZEPHYR_SDK_INSTALL_DIR=/opt/toolchains/zephyr-sdk-$(cat SDK_VERSION)" >> "$GITHUB_ENV"

      - name: Compile controller with Shorter Connection Intervals ON (nRF54L)
        shell: bash
        run: |
          export ZEPHYR_BASE="${PWD}"
          source tests/bsim/compile.source
          conf_overlay="${ZEPHYR_BASE}/tests/bsim/bluetooth/ll/conn_subrate/overlay-sci.conf" \
            app=tests/bsim/bluetooth/ll/conn_subrate compile
          wait_for_background_jobs

      - name: Compile controller with Frame Space Update ON (nRF54L)
        shell: bash
        run: |
          export ZEPHYR_BASE="${PWD}"
          source tests/bsim/compile.source
          conf_overlay="${ZEPHYR_BASE}/tests/bsim/bluetooth/ll/conn_subrate/overlay-fsu.conf" \
            app=tests/bsim/bluetooth/ll/conn_subrate compile
          wait_for_background_jobs

      - name: Run the SCI scenarios (nRF54L bsim)
        shell: bash
        run: |
          export ZEPHYR_BASE="${PWD}"
          export EXECUTE_TIMEOUT=180
          tests/bsim/bluetooth/ll/conn_subrate/tests_scripts/conn_sci.sh
          tests/bsim/bluetooth/ll/conn_subrate/tests_scripts/conn_sci_subrate.sh
          tests/bsim/bluetooth/ll/conn_subrate/tests_scripts/conn_sci_coex.sh
          tests/bsim/bluetooth/ll/conn_subrate/tests_scripts/conn_ecv_coex.sh
          tests/bsim/bluetooth/ll/conn_subrate/tests_scripts/conn_sci_collision.sh
          tests/bsim/bluetooth/ll/conn_subrate/tests_scripts/conn_sci_latency.sh

      - name: Run the Frame Space Update scenario (nRF54L bsim)
        shell: bash
        run: |
          export ZEPHYR_BASE="${PWD}"
          export EXECUTE_TIMEOUT=120
          tests/bsim/bluetooth/ll/conn_subrate/tests_scripts/conn_fsu.sh

  # Build-only check of the hardware-in-the-loop sci_latency sample for the
  # physical nRF54L15 DK (both roles), so it does not bit-rot against controller
  # API changes. The sample is driven on real DKs over VCOM UART; CI cannot run it.
  sci-sample-build:
    runs-on: ubuntu-22.04
    container:
      image: docker.io/zephyrprojectrtos/ci:v0.27.4
      options: "--entrypoint /bin/bash"
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
    steps:
      - name: Apply container owner mismatch workaround
        run: git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve west topdir
        run: echo "WEST_TOPDIR=$(realpath "$GITHUB_WORKSPACE/..")" >> "$GITHUB_ENV"

      - name: Cache west modules
        uses: actions/cache@v5
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            ${{ env.WEST_TOPDIR }}/modules
            ${{ env.WEST_TOPDIR }}/tools
            ${{ env.WEST_TOPDIR }}/bootloader
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
        timeout-minutes: 5
        continue-on-error: true

      - name: West init + update
        run: |
          west init -l . || true
          west config manifest.group-filter -- +ci,+optional
          west config --global update.narrow true
          west update 1> west.update.log 2>&1
          west forall -c 'git reset --hard HEAD'
          echo "ZEPHYR_SDK_INSTALL_DIR=/opt/toolchains/zephyr-sdk-$(cat SDK_VERSION)" >> "$GITHUB_ENV"

      - name: Build sci_latency sample (nRF54L15 DK, both roles, build-only)
        run: |
          export ZEPHYR_BASE="${PWD}"
          ./scripts/twister -p nrf54l15dk/nrf54l15/cpuapp \
            -T samples/bluetooth/sci_latency --build-only --inline-logs -v -N \
            --no-detailed-test-id
