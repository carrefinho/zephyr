# What produces the FIRST stranded prepare?
#
# Runs the single-link CENTRAL reproduction (host device, one connection, no
# overlapping second link - the simplest system that still overflows) with an
# event-by-event trace of the prepare pipeline compiled in:
#
#   prep_cb.c   an event's prepare_cb runs; it becomes event.curr
#   prep_reset  trx_cnt zeroed for the new event
#   trx++       an exchange completed (clears the -EBUSY condition)
#   enq         a prepare entered the pipeline
#   cab.c/.p    is_abort_cb consulted: next, curr, trx/tx count
#   preempt     the decision, flagged when it returns -EBUSY (the strand)
#
# bsim charges zero simulated time for computation, so this instrumentation
# does not perturb the timing under study.
name: Prep-Pipeline Strand Trace

on:
  push:
    branches:
      - "bsim-strand-origin"
  workflow_dispatch:

jobs:
  trace:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    container:
      image: docker.io/zephyrprojectrtos/ci:v0.27.4
      options: "--entrypoint /bin/bash"
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
      BSIM_OUT_PATH: /opt/bsim/
      BSIM_COMPONENTS_PATH: /opt/bsim/components
      BOARD: nrf52_bsim
    steps:
      - name: Apply container owner mismatch workaround
        run: git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve west topdir
        run: echo "WEST_TOPDIR=$(realpath "$GITHUB_WORKSPACE/..")" >> "$GITHUB_ENV"

      - name: Cache west modules
        uses: actions/cache@v5
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            ${{ env.WEST_TOPDIR }}/modules
            ${{ env.WEST_TOPDIR }}/tools
            ${{ env.WEST_TOPDIR }}/bootloader
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
        timeout-minutes: 5
        continue-on-error: true

      - name: West init + update
        run: |
          west init -l . || true
          west config manifest.group-filter -- +ci,+optional
          west config --global update.narrow true
          west update 1> west.update.log 2>&1
          west forall -c 'git reset --hard HEAD'
          echo "ZEPHYR_SDK_INSTALL_DIR=/opt/toolchains/zephyr-sdk-$(cat SDK_VERSION)" >> "$GITHUB_ENV"

      - name: Compile with the strand trace
        shell: bash
        run: |
          export ZEPHYR_BASE="${PWD}"
          source tests/bsim/compile.source
          app=tests/bsim/bluetooth/ll/prep_pipeline conf_overlay=overlay_trace.conf compile
          wait_for_background_jobs

      - name: "Trace the single-link CENTRAL reproduction"
        shell: bash
        run: |
          export ZEPHYR_BASE="${PWD}"
          set +e
          LAT_TARGET=host SEED=1 LAT_BURST_US=400 LAT_PERIOD_US=3300 SIM_US=30e6 \
            BIN_SUFFIX=prj_conf_overlay_trace_conf \
            tests/bsim/bluetooth/ll/prep_pipeline/tests_scripts/prep_pipeline_overflow.sh \
            | tee trace_run.log
          set -e
          grep -q 'REPRODUCED' trace_run.log || {
            echo "::error::trace build did not reproduce - instrumentation changed behaviour"; exit 1; }

      - name: "Extract: the FIRST strand and its lead-up"
        shell: bash
        run: |
          set +e   # greps that legitimately match nothing must not kill the step
          hostlog="$(ls -t /opt/bsim/bin/*_host.log | head -1)"
          cp "${hostlog}" host_trace.log
          first="$(grep -n 'STRAND (neither aborted)' host_trace.log | head -1 | cut -d: -f1)"
          [ -n "${first}" ] || { echo "no strand found"; tail -40 host_trace.log; exit 1; }

          echo "=============== HEALTHY event immediately before, for comparison ============"
          prev2="$(grep -n 'STRAND prep_cb' host_trace.log | awk -F: -v f="${first}" '$1 < f' | tail -2 | head -1 | cut -d: -f1)"
          lastprep="$(grep -n 'STRAND prep_cb' host_trace.log | awk -F: -v f="${first}" '$1 < f' | tail -1 | cut -d: -f1)"
          sed -n "${prev2},$(( lastprep - 1 ))p" host_trace.log | grep 'STRAND ' | head -25

          echo
          echo "=============== THE STUCK EVENT, through the strand ========================="
          sed -n "${lastprep},${first}p" host_trace.log | grep 'STRAND '

          echo
          echo "=============== after the strand ==========================================="
          after="$(sed -n "$(( first + 1 )),\$p" host_trace.log)"
          for k in isr_radio isr_set tmr_start hcto_cfg radio_disable tmr_status_reset prep_cb 'trx++' 'inj mask off'; do
            printf "  %-18s %s\n" "${k}" "$(echo "${after}" | grep -c "STRAND ${k}")"
          done

          echo
          echo "=============== anchor sanity (tmr_start ticks_start vs now) ==============="
          sed -n "1,${first}p" host_trace.log | grep 'STRAND tmr_start' | tail -10 | \
            awk '{ for (i=1;i<=NF;i++) { if ($i ~ /^ticks_start=/) { ts=$i; sub(/ticks_start=/,"",ts) }
                                          if ($i ~ /^now=/) { n=$i; sub(/now=/,"",n) } }
                   printf "  ticks_start=%s now=%s delta=%+d%s\n", ts, n, ts-n, (ts-n<0?"  <-- PAST":"") }'
          exit 0

      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prep-pipeline-strand-trace
          path: |
            trace_run.log
            host_trace.log
            /opt/bsim/bin/*_host.log
          if-no-files-found: warn
          retention-days: 14
