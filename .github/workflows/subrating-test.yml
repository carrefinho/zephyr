# Focused CI for the LE Connection Subrating work on a fork.
#
# Zephyr's upstream twister.yaml / bsim-tests.yaml are gated to
# `github.repository_owner == 'zephyrproject-rtos'` and require the
# self-hosted `zephyr-runner-v2` runner group, so they do NOT run on a fork.
# This workflow reuses the same public CI container image (which bundles GCC,
# the Zephyr SDK and BabbleSim) but runs un-gated on GitHub-hosted runners and
# executes only the subrating controller unit test.
#
# BabbleSim (radio-level / event-skipping validation) is added in a follow-up
# once Phase 2/3 lands the actual connection-event skipping; the image already
# ships bsim at /opt/bsim, so it is only a matter of adding a job that runs the
# tests/bsim/bluetooth subrating scenario.
name: Subrating Tests

on:
  # NB: '+' is a glob metacharacter in GitHub branch filters, so the literal
  # branch name "v4.1.0+zmk+subrating" cannot be matched directly. Match all
  # branches (only this branch carries the workflow file) instead.
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  ctrl-subrate-unit:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/zephyrproject-rtos/ci-repo-cache:v0.27.4.20241026
      options: "--entrypoint /bin/bash"
    steps:
      - name: Apply container owner mismatch workaround
        run: git config --global --add safe.directory '*'

      - name: Clone cached Zephyr repository (speeds up checkout/update)
        continue-on-error: true
        run: |
          git clone --shared /repo-cache/zephyrproject/zephyr .
          git remote set-url origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: West init + update
        run: |
          west init -l . || true
          west config manifest.group-filter -- +ci,+optional
          west config --global update.narrow true
          # Prefer the in-image repo cache; fall back to a network update.
          west update --path-cache /repo-cache/zephyrproject 1> west.update.log 2>&1 \
            || west update 1> west.update.log 2>&1
          west forall -c 'git reset --hard HEAD'
          echo "ZEPHYR_SDK_INSTALL_DIR=/opt/toolchains/zephyr-sdk-$(cat SDK_VERSION)" >> "$GITHUB_ENV"

      - name: Run ctrl_subrate unit test
        run: |
          export ZEPHYR_BASE="${PWD}"
          export ZEPHYR_TOOLCHAIN_VARIANT=zephyr
          ./scripts/twister -p unit_testing \
            -T tests/bluetooth/controller/ctrl_subrate \
            --inline-logs -v -N --no-detailed-test-id

      - name: Upload twister output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twister-out
          path: |
            twister-out/twister.log
            twister-out/**/build.log
            twister-out/**/handler.log
          if-no-files-found: ignore

  # BabbleSim radio-level validation of the Phase 2 peripheral event-skipping.
  # The CI image ships a pre-built BabbleSim at /opt/bsim, so we only compile the
  # subrating scenario and run it (no in-workspace babblesim modules needed).
  ctrl-subrate-bsim:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/zephyrproject-rtos/ci-repo-cache:v0.27.4.20241026
      options: "--entrypoint /bin/bash"
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
      BSIM_OUT_PATH: /opt/bsim/
      BSIM_COMPONENTS_PATH: /opt/bsim/components
    steps:
      - name: Apply container owner mismatch workaround
        run: git config --global --add safe.directory '*'

      - name: Clone cached Zephyr repository (speeds up checkout/update)
        continue-on-error: true
        run: |
          git clone --shared /repo-cache/zephyrproject/zephyr .
          git remote set-url origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: West init + update
        run: |
          west init -l . || true
          west config manifest.group-filter -- +ci,+optional
          west config --global update.narrow true
          west update --path-cache /repo-cache/zephyrproject 1> west.update.log 2>&1 \
            || west update 1> west.update.log 2>&1
          west forall -c 'git reset --hard HEAD'
          echo "ZEPHYR_SDK_INSTALL_DIR=/opt/toolchains/zephyr-sdk-$(cat SDK_VERSION)" >> "$GITHUB_ENV"

      - name: Compile subrating bsim scenario
        shell: bash
        run: |
          export ZEPHYR_BASE="${PWD}"
          source tests/bsim/compile.source
          app=tests/bsim/bluetooth/ll/conn_subrate compile
          wait_for_background_jobs

      - name: Run subrating bsim scenario
        shell: bash
        run: |
          export ZEPHYR_BASE="${PWD}"
          export EXECUTE_TIMEOUT=120
          tests/bsim/bluetooth/ll/conn_subrate/tests_scripts/conn_subrate.sh
