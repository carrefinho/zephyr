# Deterministic bsim reproduction of the ZMK split-central prepare-pipeline
# overflow crash: LL_ASSERT(next) @ ll_sw/nordic/lll/lll.c (zmkfirmware/zmk#3370).
#
# Runs the same nRF52 LL_SW controller as the real firmware on the nrf52_bsim HW
# model. A dual-role DUT (peripheral to `host` + central to `split`, like a ZMK
# central) drives two saturated 7.5 ms links so their events overlap, exercising
# the LL_SW preempt/duplicate-prepare path until the prepare pipeline (shrunk to
# 3 via the accel overlay) overflows and the controller asserts.
#
# Green = the overflow reproduced (the sweep found a seed that asserts). The
# logs artifact carries the "ASSERTION FAIL [next] @ .../lll.c" line.
#
# A/B against the fix (93b951d + 0d1b4d2) is in the test README - cherry-pick
# them onto this branch and the same sweep should report NO_OVERFLOW.
name: Prep-Pipeline Overflow Repro

on:
  push:
    branches:
      - "bsim-prep-pipeline-repro"
  workflow_dispatch:

jobs:
  reproduce-bsim:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    container:
      # Leaner Docker Hub image (~5.2 GB, bundles /opt/bsim). The GHCR
      # ci-repo-cache image is ~3x larger and exhausts the runner disk on pull
      # ("no space left on device"). Note the org slug has NO hyphen on Docker Hub.
      image: docker.io/zephyrprojectrtos/ci:v0.27.4
      options: "--entrypoint /bin/bash"
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
      BSIM_OUT_PATH: /opt/bsim/
      BSIM_COMPONENTS_PATH: /opt/bsim/components
      BOARD: nrf52_bsim
    steps:
      - name: Apply container owner mismatch workaround
        run: git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve west topdir
        run: echo "WEST_TOPDIR=$(realpath "$GITHUB_WORKSPACE/..")" >> "$GITHUB_ENV"

      - name: Cache west modules
        uses: actions/cache@v5
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            ${{ env.WEST_TOPDIR }}/modules
            ${{ env.WEST_TOPDIR }}/tools
            ${{ env.WEST_TOPDIR }}/bootloader
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
        timeout-minutes: 5
        continue-on-error: true

      - name: West init + update
        run: |
          west init -l . || true
          west config manifest.group-filter -- +ci,+optional
          west config --global update.narrow true
          west update 1> west.update.log 2>&1
          west forall -c 'git reset --hard HEAD'
          echo "ZEPHYR_SDK_INSTALL_DIR=/opt/toolchains/zephyr-sdk-$(cat SDK_VERSION)" >> "$GITHUB_ENV"

      - name: "Compile prep_pipeline bsim app (accel EVENT_PIPELINE_MAX=3 + stock depth-7)"
        shell: bash
        run: |
          export ZEPHYR_BASE="${PWD}"
          source tests/bsim/compile.source
          app=tests/bsim/bluetooth/ll/prep_pipeline conf_overlay=overlay_accel.conf compile
          app=tests/bsim/bluetooth/ll/prep_pipeline compile
          wait_for_background_jobs

      - name: Sweep CPU-latency matrix until the prepare pipeline overflows
        shell: bash
        run: |
          export ZEPHYR_BASE="${PWD}"
          export SEEDS="1 2"
          # Ascending bursts: the sweep exits at the first reproducing cell, so
          # this doubles as a threshold probe (v3.5 survives the 400us band).
          export BURSTS_US="100 200 300 400 1500 6000"
          export PERIODS_US="3300 5700"
          export SIM_US=30e6
          tests/bsim/bluetooth/ll/prep_pipeline/tests_scripts/prep_pipeline_sweep.sh \
            | tee sweep_base.log
          cell="$(grep 'SWEEP: reproduced' sweep_base.log)"
          echo "REPRO_SEED=$(echo "${cell}" | sed 's/.*seed=\([0-9]*\).*/\1/')" >> "$GITHUB_ENV"
          echo "REPRO_BURST=$(echo "${cell}" | sed 's/.*burst=\([0-9]*\).*/\1/')" >> "$GITHUB_ENV"
          echo "REPRO_PERIOD=$(echo "${cell}" | sed 's/.*period=\([0-9]*\).*/\1/')" >> "$GITHUB_ENV"

      - name: "Signature check: gdb-walk the prep MFIFO at the assert"
        shell: bash
        run: |
          command -v gdb >/dev/null || { apt-get update -qq && apt-get install -y -qq gdb; }
          export ZEPHYR_BASE="${PWD}"
          export SEED="${REPRO_SEED}" LAT_BURST_US="${REPRO_BURST}" LAT_PERIOD_US="${REPRO_PERIOD}"
          export SIM_US=30e6
          tests/bsim/bluetooth/ll/prep_pipeline/tests_scripts/prep_pipeline_inspect.sh

      - name: "Depth-7 control: stock EVENT_PIPELINE_MAX, no accelerator"
        shell: bash
        run: |
          export ZEPHYR_BASE="${PWD}"
          export BIN_SUFFIX=prj_conf
          export SEEDS="1 2"
          export BURSTS_US="400 1500 6000"
          export PERIODS_US="3300 5700"
          export SIM_US=60e6
          set +e
          tests/bsim/bluetooth/ll/prep_pipeline/tests_scripts/prep_pipeline_sweep.sh \
            | tee sweep_depth7.log
          set -e
          if grep -q 'SWEEP: reproduced' sweep_depth7.log; then
            echo "CONTROL RESULT: DEPTH-7 STOCK PIPELINE ALSO OVERFLOWS (accel not load-bearing)"
          else
            echo "CONTROL RESULT: depth-7 did not overflow in this matrix/sim length"
          fi

      - name: "A/B arm 1: cherry-pick 93b951d6fb3 + 0d1b4d2ba6b (the 2-commit fix)"
        shell: bash
        run: |
          export ZEPHYR_BASE="${PWD}"
          git fetch --depth=2 https://github.com/zephyrproject-rtos/zephyr.git \
            93b951d6fb31fc499a0594dd4433fb9136944c4c \
            0d1b4d2ba6b5f46e7b76b49500ddd3d8dde28f2d
          git -c user.name=ci -c user.email=ci@local \
            cherry-pick -n 93b951d6fb31fc499a0594dd4433fb9136944c4c
          git -c user.name=ci -c user.email=ci@local \
            cherry-pick -n 0d1b4d2ba6b5f46e7b76b49500ddd3d8dde28f2d
          rm -rf bsim_out
          source tests/bsim/compile.source
          app=tests/bsim/bluetooth/ll/prep_pipeline conf_overlay=overlay_accel.conf compile
          wait_for_background_jobs
          export SEEDS="1 2"
          export BURSTS_US="400 1500 6000"
          export PERIODS_US="3300 5700"
          export SIM_US=30e6
          set +e
          tests/bsim/bluetooth/ll/prep_pipeline/tests_scripts/prep_pipeline_sweep.sh \
            | tee sweep_fix2.log
          set -e
          if grep -q 'SWEEP: reproduced' sweep_fix2.log; then
            echo "ARM RESULT: 2-COMMIT FIX STILL OVERFLOWS"
          else
            echo "ARM RESULT: 2-COMMIT FIX HELD (no overflow across the matrix)"
          fi
          git reset --hard HEAD -q

      - name: "A/B arm 2: revert ee844550b7e (short-prepare rework; Vinayak's proposal)"
        shell: bash
        run: |
          export ZEPHYR_BASE="${PWD}"
          git fetch --depth=2 https://github.com/zephyrproject-rtos/zephyr.git \
            ee844550b7edd06b082a7c960f72454f301d28c7
          git -c user.name=ci -c user.email=ci@local \
            revert -n ee844550b7edd06b082a7c960f72454f301d28c7
          rm -rf bsim_out
          source tests/bsim/compile.source
          app=tests/bsim/bluetooth/ll/prep_pipeline conf_overlay=overlay_accel.conf compile
          wait_for_background_jobs
          export SEEDS="1 2"
          export BURSTS_US="400 1500 6000"
          export PERIODS_US="3300 5700"
          export SIM_US=30e6
          set +e
          tests/bsim/bluetooth/ll/prep_pipeline/tests_scripts/prep_pipeline_sweep.sh \
            | tee sweep_revert.log
          set -e
          if grep -q 'SWEEP: reproduced' sweep_revert.log; then
            echo "ARM RESULT: ee844550 REVERT STILL OVERFLOWS"
          else
            echo "ARM RESULT: ee844550 REVERT HELD (no overflow across the matrix)"
          fi
          git reset --hard HEAD -q

      - name: "A/B arm 3: FULL forward-fix set (selective branch + the omitted 0d1b4d2)"
        shell: bash
        run: |
          # Pete's selective branch (comments + radio-IRQ + observer-fix + quick
          # check) crashed Seth's overnight soak - but it OMITTED 0d1b4d2. This
          # arm applies all five in the selective branch's order plus 0d1b4d2,
          # answering: would the complete forward-fix set have held?
          export ZEPHYR_BASE="${PWD}"
          git fetch --depth=2 https://github.com/zephyrproject-rtos/zephyr.git \
            d737e285e57bae84057160a5ee94b7c566b9705e \
            93b951d6fb31fc499a0594dd4433fb9136944c4c \
            0d1b4d2ba6b5f46e7b76b49500ddd3d8dde28f2d
          git fetch --depth=2 https://github.com/petejohanson/zephyr.git \
            aee74037119b3747068d1c50c35de6e73cb4ddb7 \
            fec5aa21abe5395fe64f700307b98c320a520b5e
          for c in d737e285e57bae84057160a5ee94b7c566b9705e \
                   aee74037119b3747068d1c50c35de6e73cb4ddb7 \
                   93b951d6fb31fc499a0594dd4433fb9136944c4c \
                   fec5aa21abe5395fe64f700307b98c320a520b5e \
                   0d1b4d2ba6b5f46e7b76b49500ddd3d8dde28f2d; do
            git -c user.name=ci -c user.email=ci@local cherry-pick -n "$c" \
              || { echo "ARM RESULT: FULL SET cherry-pick CONFLICT at $c"; exit 0; }
          done
          rm -rf bsim_out
          source tests/bsim/compile.source
          app=tests/bsim/bluetooth/ll/prep_pipeline conf_overlay=overlay_accel.conf compile
          wait_for_background_jobs
          export SEEDS="1 2"
          export BURSTS_US="400 1500 6000"
          export PERIODS_US="3300 5700"
          export SIM_US=30e6
          set +e
          tests/bsim/bluetooth/ll/prep_pipeline/tests_scripts/prep_pipeline_sweep.sh \
            | tee sweep_fullset.log
          set -e
          if grep -q 'SWEEP: reproduced' sweep_fullset.log; then
            echo "ARM RESULT: FULL FORWARD-FIX SET STILL OVERFLOWS"
          else
            echo "ARM RESULT: FULL FORWARD-FIX SET HELD (no overflow across the matrix)"
          fi
          git reset --hard HEAD -q

      - name: "A/B arm 4: revert 2b30259e9f0 (the 3.5->4.1 re-applied dequeue walk)"
        shell: bash
        run: |
          # The provenance analysis: v3.5.0 shipped WITHOUT the param-only
          # normal-event traversal in ull_prepare_dequeue (0d54ca87616
          # introduced it, 91781306e95 reverted it pre-3.5, 2b30259e9f0
          # re-applied it for 4.x). v3.5 holds the 400us band; v4.1 dies.
          # This arm removes exactly that delta from v4.1 - if it holds where
          # every other arm fails, 2b30259 is the regression.
          export ZEPHYR_BASE="${PWD}"
          git fetch --depth=2 https://github.com/zephyrproject-rtos/zephyr.git \
            2b30259e9f043a0d6683a75b378cfd6c23211b05
          git -c user.name=ci -c user.email=ci@local \
            revert -n --no-edit 2b30259e9f043a0d6683a75b378cfd6c23211b05
          rm -rf bsim_out
          source tests/bsim/compile.source
          app=tests/bsim/bluetooth/ll/prep_pipeline conf_overlay=overlay_accel.conf compile
          app=tests/bsim/bluetooth/ll/prep_pipeline compile
          wait_for_background_jobs
          export SEEDS="1 2"
          export BURSTS_US="300 400 1500 6000"
          export PERIODS_US="3300 5700"
          export SIM_US=30e6
          set +e
          tests/bsim/bluetooth/ll/prep_pipeline/tests_scripts/prep_pipeline_sweep.sh \
            | tee sweep_rev2b30259.log
          BIN_SUFFIX=prj_conf SEEDS="1 2 3 4" BURSTS_US="400" SIM_US=60e6 \
            tests/bsim/bluetooth/ll/prep_pipeline/tests_scripts/prep_pipeline_sweep.sh \
            | tee sweep_rev2b30259_d7.log
          set -e
          if grep -q 'SWEEP: reproduced' sweep_rev2b30259.log; then
            echo "ARM RESULT: 2b30259 REVERT STILL OVERFLOWS (accel matrix)"
          else
            echo "ARM RESULT: 2b30259 REVERT HELD the accel matrix"
          fi
          if grep -q 'SWEEP: reproduced' sweep_rev2b30259_d7.log; then
            echo "ARM RESULT: 2b30259 REVERT STILL OVERFLOWS (depth-7 400us soak)"
          else
            echo "ARM RESULT: 2b30259 REVERT HELD the depth-7 400us soak"
          fi
          git reset --hard HEAD -q

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "=== base ===";    grep -E 'RESULT:|SWEEP:' sweep_base.log    || true
          echo "=== depth7 ===";  grep -E 'SWEEP:' sweep_depth7.log          || true
          echo "=== fix2 ===";    grep -E 'SWEEP:' sweep_fix2.log            || true
          echo "=== revert ===";  grep -E 'SWEEP:' sweep_revert.log          || true
          echo "=== fullset ==="; grep -E 'SWEEP:' sweep_fullset.log         || true
          echo "=== rev2b30259 accel ==="; grep -E 'SWEEP:' sweep_rev2b30259.log || true
          echo "=== rev2b30259 depth7 ==="; grep -E 'SWEEP:' sweep_rev2b30259_d7.log || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prep-pipeline-repro-logs
          path: |
            /opt/bsim/bin/prep_pipe_*.log
            sweep_*.log
            west.update.log
          if-no-files-found: ignore

  # Negative control: the identical test + latency matrix on ZMK's actual
  # shipped Zephyr 3.5 tree (v3.5.0+zmk-fixes). ZMK centrals were stable on
  # 3.5 in the field, and the buggy ull_prepare_dequeue param-only walk was
  # reverted OUT of v3.5.0 and re-applied for 4.x (2b30259e9f0). If 3.5 holds
  # where 4.1 overflows, the harness discriminates and the regression window
  # is confirmed under identical load. If 3.5 ALSO overflows, the injected
  # latency is overloading any controller and the accel depth is suspect.
  control-v35:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    continue-on-error: true
    container:
      image: docker.io/zephyrprojectrtos/ci:v0.27.4
      options: "--entrypoint /bin/bash"
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
      BSIM_OUT_PATH: /opt/bsim/
      BSIM_COMPONENTS_PATH: /opt/bsim/components
      BOARD: nrf52_bsim
      BOARD_TS: nrf52_bsim
    steps:
      - name: Apply container owner mismatch workaround
        run: git config --global --add safe.directory '*'

      - name: Checkout (test sources)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve 3.5 west topdir
        run: echo "Z35=$(realpath "$GITHUB_WORKSPACE/..")/z35" >> "$GITHUB_ENV"

      - name: Cache 3.5 west modules
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.Z35 }}/modules
            ${{ env.Z35 }}/tools
          key: ${{ runner.os }}-z35-modules-v3.5.0-zmk-fixes
        timeout-minutes: 5
        continue-on-error: true

      - name: Clone ZMK Zephyr 3.5 + west update
        shell: bash
        run: |
          mkdir -p "${Z35}" && cd "${Z35}"
          [ -d zephyr ] || git clone --depth 1 --branch v3.5.0+zmk-fixes \
            https://github.com/zmkfirmware/zephyr.git zephyr
          west init -l zephyr || true
          west config manifest.group-filter -- +ci,+optional
          west config --global update.narrow true
          west update 1> west35.update.log 2>&1

      - name: Port test into the 3.5 tree + compile
        shell: bash
        run: |
          cd "${Z35}/zephyr"
          cp -r "${GITHUB_WORKSPACE}/tests/bsim/bluetooth/ll/prep_pipeline" \
            tests/bsim/bluetooth/ll/
          # 3.5's lll.h hard-defines EVENT_PIPELINE_MAX; add the same #ifndef
          # guard the 4.1 branch carries so the accel overlay can shrink it.
          sed -i 's/^#define EVENT_PIPELINE_MAX 7$/#ifndef EVENT_PIPELINE_MAX\n#define EVENT_PIPELINE_MAX 7\n#endif/' \
            subsys/bluetooth/controller/ll_sw/lll.h
          grep -n -B1 -A2 'define EVENT_PIPELINE_MAX' subsys/bluetooth/controller/ll_sw/lll.h
          export ZEPHYR_BASE="${PWD}"
          # 3.5's cmake needs the SDK location handed to it in this image
          # (find_package has no registry hit here); newest installed SDK
          # satisfies the >=0.16 requirement.
          export ZEPHYR_SDK_INSTALL_DIR="$(ls -d /opt/toolchains/zephyr-sdk-* | sort -V | tail -1)"
          echo "Using SDK: ${ZEPHYR_SDK_INSTALL_DIR}"
          source tests/bsim/compile.source
          app=tests/bsim/bluetooth/ll/prep_pipeline conf_file=prj_35.conf \
            conf_overlay=overlay_accel.conf compile
          app=tests/bsim/bluetooth/ll/prep_pipeline conf_file=prj_35.conf compile
          wait_for_background_jobs

      - name: "3.5 depth-7, 400us band, long soak (the headline comparison vs 4.1)"
        shell: bash
        run: |
          # v4.1 at stock depth 7 overflows at burst=400 period=3300 within
          # ~1 s. Same band on 3.5, 60 s x 4 seeds: HELD here = the field
          # regression reproduced at realistic (~12% masked) latency.
          cd "${Z35}/zephyr"
          export ZEPHYR_BASE="${PWD}"
          export BIN_SUFFIX=prj_35_conf
          export SEEDS="1 2 3 4"
          export BURSTS_US="400"
          export PERIODS_US="3300 5700"
          export SIM_US=60e6
          set +e
          tests/bsim/bluetooth/ll/prep_pipeline/tests_scripts/prep_pipeline_sweep.sh \
            | tee sweep_v35_d7_400.log
          set -e
          if grep -q 'SWEEP: reproduced' sweep_v35_d7_400.log; then
            echo "CONTROL RESULT: 3.5 DEPTH-7 400us BAND OVERFLOWS - no regression story at realistic latency"
          else
            echo "CONTROL RESULT: 3.5 DEPTH-7 400us BAND HELD - 3.5->4.1 regression confirmed at realistic latency"
          fi

      - name: "3.5 depth-7, extreme bursts (characterization, informational)"
        shell: bash
        run: |
          cd "${Z35}/zephyr"
          export ZEPHYR_BASE="${PWD}"
          export BIN_SUFFIX=prj_35_conf
          export SEEDS="1 2"
          export BURSTS_US="1500 6000"
          export PERIODS_US="3300 5700"
          export SIM_US=30e6
          set +e
          tests/bsim/bluetooth/ll/prep_pipeline/tests_scripts/prep_pipeline_sweep.sh \
            | tee sweep_v35_d7_extreme.log
          set -e
          if grep -q 'SWEEP: reproduced' sweep_v35_d7_extreme.log; then
            echo "CONTROL RESULT: 3.5 depth-7 overflows under EXTREME bursts (>=45% masked) - overload band, keep headline at 400us"
          else
            echo "CONTROL RESULT: 3.5 depth-7 held even under extreme bursts"
          fi

      - name: "Sweep the accel (depth-3) matrix on 3.5 (context)"
        shell: bash
        run: |
          cd "${Z35}/zephyr"
          export ZEPHYR_BASE="${PWD}"
          export BIN_SUFFIX=prj_35_conf_overlay_accel_conf
          export SEEDS="1 2"
          export BURSTS_US="400 1500 6000"
          export PERIODS_US="3300 5700"
          export SIM_US=30e6
          set +e
          tests/bsim/bluetooth/ll/prep_pipeline/tests_scripts/prep_pipeline_sweep.sh \
            | tee sweep_v35.log
          set -e
          grep -E 'RESULT:|SWEEP:' sweep_v35.log || true

      - name: Upload 3.5 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prep-pipeline-v35-logs
          path: |
            /opt/bsim/bin/prep_pipe_*.log
            ${{ env.Z35 }}/zephyr/sweep_v35*.log
          if-no-files-found: ignore
