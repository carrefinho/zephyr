# Overlay to compile (and later run) the controller-side Shorter Connection
# Intervals (SCI) code in a real LL_SW build (nrf52_bsim).
#
# CONFIG_BT_SHORTER_CONNECTION_INTERVALS=y (host) turns on
# CONFIG_BT_CTLR_SHORTER_CONNECTION_INTERVALS (default y if the host symbol) now
# that LL_SW selects BT_CTLR_SHORTER_CONNECTION_INTERVALS_SUPPORT, and selects
# BT_CTLR_SET_HOST_FEATURE for the page-1 host-support bit (73). SCI depends on
# both the LL Extended Feature Set (feature page 1 carries SCI bits 72/73) and
# the subrating port (subrate params are fused into the Connection Rate PDUs),
# so both are enabled here. Used as a build-only compile gate for the controller
# steps; the end-to-end bsim run lands with the procedure + test (later step).
CONFIG_BT_LE_EXTENDED_FEAT_SET=y
CONFIG_BT_LE_MAX_LOCAL_SUPPORTED_FEATURE_PAGE=1
CONFIG_BT_SHORTER_CONNECTION_INTERVALS=y
