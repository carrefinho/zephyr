# Overlay to compile the controller-side LL Extended Feature Set code in a real
# LL_SW build (nrf52_bsim), which the host-only bluetooth.shell EFS test
# (BT_LL_SW_SPLIT=n) does NOT exercise. CONFIG_BT_LE_EXTENDED_FEAT_SET=y (host)
# turns on CONFIG_BT_CTLR_EXTENDED_FEAT_SET (default y if the host symbol) now
# that LL_SW selects BT_CTLR_EXTENDED_FEAT_SET_SUPPORT. Used as a build-only
# compile gate; EFS does not exchange feature pages on air until the procedure +
# HCI backends land (later steps).
CONFIG_BT_LE_EXTENDED_FEAT_SET=y
CONFIG_BT_LE_MAX_LOCAL_SUPPORTED_FEATURE_PAGE=1
