CONFIG_BT=y
CONFIG_LOG=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_DEVICE_NAME="bsim_subrate"

# Keep the connection interval fixed: the peripheral's ~5s auto-update to its
# preferred params would otherwise change the interval and reset subrating
# mid-test (the test controls interval changes explicitly).
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n

# LE Connection Subrating: host API (bt_conn_le_subrate_*) + Set Host Feature
# bit, and the controller-side negotiation + peripheral event skipping.
CONFIG_BT_SUBRATING=y
CONFIG_BT_CTLR_SUBRATING=y
