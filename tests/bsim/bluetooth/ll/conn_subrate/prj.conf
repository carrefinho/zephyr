CONFIG_BT=y
CONFIG_LOG=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_DEVICE_NAME="bsim_subrate"

# Keep the connection interval fixed: the peripheral's ~5s auto-update to its
# preferred params would otherwise change the interval and reset subrating
# mid-test (the test controls interval changes explicitly).
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n

# LE Connection Subrating: host API (bt_conn_le_subrate_*) + Set Host Feature
# bit, and the controller-side negotiation + peripheral event skipping.
CONFIG_BT_SUBRATING=y
CONFIG_BT_CTLR_SUBRATING=y

# PHY update (le_phy_updated callback) for the PHY-update-while-subrated test.
CONFIG_BT_USER_PHY_UPDATE=y

# Heart Rate Service for the notifications-under-subrating test.
CONFIG_BT_HRS=y

# Per-connection event counter for the central-cadence regression test
# (central_lat_count): asserts the central honors its subrate skip and does not
# burst to full rate on the peripheral's stacked-latency skipped events.
CONFIG_BT_CTLR_TEST_CONN_EVENT_COUNT=y

# The central_multi test holds two simultaneous links on the central.
CONFIG_BT_MAX_CONN=3
