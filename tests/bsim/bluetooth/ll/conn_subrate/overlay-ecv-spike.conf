# ECV scheduling feasibility spike (central_ecv_sweep): push the split link
# below 1.25 ms via the low-latency reduced-reservation path and sweep the
# sub-1.25 ms band {1000,875,750,625,500} us under a concurrent 30 ms link, on
# nrf54l15bsim (the single-timer primary SoC). This is the ECV go/no-go: does
# LL_SW hold a sub-1.25 ms anchor under split contention, and down to what floor.
# Isolated as an overlay so the >=7.5 ms subrating / SCI / EFS scenarios (which
# never request sub-7.5 ms and never engage the low-latency path) are unaffected.

# Drops the controller's CPR interval floor (CONN_INTERVAL_MIN) and engages the
# reduced-reservation / is_abort_cb anchor-sync path for interval < 6 units.
CONFIG_BT_CTLR_CONN_INTERVAL_LOW_LATENCY=y

# Prerequisite that makes the low-latency symbol overridable -- without it,
# LOW_LATENCY=y is silently ignored (visible-if gate in Kconfig.ll_sw_split).
CONFIG_BT_CTLR_ADVANCED_FEATURES=y

# Disables the host's 7.5 ms-minimum connection-parameter validation so the
# sub-7.5 ms param update reaches the controller.
CONFIG_BT_CONN_PARAM_ANY=y

# Under sub-1.25 ms contention the prepare path may see non-zero preempt
# overhead. With this assert ON (the LL_SW default) that path k_oops-es (crash,
# no data); with it OFF the event gracefully aborts (-ECANCELED) and the lost
# event simply shows up as reduced cadence -- which is exactly the metric the
# sweep measures. (Matches the iso-hybrid-split finding that the assert must be
# off for sub-7.5 ms scheduling alongside other links.)
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n

# Done-extra pool. The auto default for this !ADV_EXT build is 4; the {750,625}us
# gate is green at the default too (run 26654390506). Kept at 12 here as the
# realistic sub-ms-ECV sizing and for margin -- the floor probe (run 26668227699)
# showed nRF52's sub-625us floor WAS done-extra-pool-bound (reached 375us with the
# bigger pool), while nRF54L's is pipeline-bound (raising this just moves the
# assert to the prepare pipeline, lll.c:892 / EVENT_PIPELINE_MAX=7), so ~625us is
# the nRF54L floor regardless. See conn_subrate.h for the measured floors.
CONFIG_BT_CTLR_EVENT_DONE_MAX=12
