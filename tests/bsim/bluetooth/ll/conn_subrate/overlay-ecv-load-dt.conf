# DUAL-TIMER A/B arm of the ECV-under-ZMK-split-load floor scenario.
#
# Byte-for-byte the same load and feature composition as overlay-ecv-load.conf
# (.conf files cannot #include, so the body below is copied verbatim), with ONE
# added line: CONFIG_BT_CTLR_SW_SWITCH_SINGLE_TIMER=n. That flips the nRF54L
# controller from the single-TIMER10 architecture (EVENT_TIMER and
# SW_SWITCH_TIMER share NRF_TIMER10) to the dual-timer architecture backported
# from upstream PR #109528: EVENT_TIMER = NRF_TIMER00 (MCU power domain, HFPLL
# 128 MHz) with SW_SWITCH_TIMER = NRF_TIMER10 (Radio domain), bridged by PPIB.
#
# The hypothesis under test: the single-timer per-event overhead
# (HAL_RADIO_ISR_LATENCY_MAX_US = 80 us, inside the abort/overhead threshold and
# fed to lll_preempt_calc) is a cause of the measured ECV floor (93% @ 750 us,
# 89% @ 625 us). In dual-timer mode radio_nrf5_resources.h automatically drops
# that constant to 0 (the nRF52840 dual-timer value), which is the mechanism the
# A/B isolates. Run this arm against overlay-ecv-load.conf's single-timer
# numbers with an otherwise identical build (same FSU 80 us tIFS, same 2M PHY,
# same 1-notification-per-CE load, same FAST radio ramp-up) so the ONLY variable
# is the timer architecture.
#
# CI wires this arm continue-on-error: it is an experimental backport and must
# never gate the branch.
CONFIG_BT_LE_EXTENDED_FEAT_SET=y
CONFIG_BT_LE_MAX_LOCAL_SUPPORTED_FEATURE_PAGE=1
CONFIG_BT_SHORTER_CONNECTION_INTERVALS=y
CONFIG_BT_FRAME_SPACE_UPDATE=y
CONFIG_BT_CTLR_FRAME_SPACE_UPDATE=y
CONFIG_BT_CTLR_FSU_MIN_FRAME_SPACE_US=80

CONFIG_BT_CTLR_SCI_ECV_INTERVAL_MIN_125US=3

CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n

CONFIG_BT_BUF_ACL_TX_COUNT=8

# --- Dual-timer A/B: the one line that distinguishes this arm ---
# BT_CTLR_ADVANCED_FEATURES (above) makes the symbol assignable; the Kconfig
# no longer force-selects single-timer on nRF54L (BT_CTLR_RADIO_ENABLE_FAST kept
# its FAST ramp-up default but dropped the select), so =n here actually sticks
# and selects the NRF_TIMER00 EVENT_TIMER dual-timer path.
CONFIG_BT_CTLR_SW_SWITCH_SINGLE_TIMER=n
