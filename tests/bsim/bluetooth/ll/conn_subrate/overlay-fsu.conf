# Overlay to compile (and later run) the Frame Space Update (FSU) controller
# code in a real LL_SW build. FSU (Core 6.2, LL feature bit 65) negotiates a
# shorter/longer inter-frame space (T_IFS, default 150 us) per connection via
# the LL_FRAME_SPACE_REQ/RSP procedure, shrinking each connection event's air
# time and scheduler slot reservation.
#
# Like SCI, the FSU feature bit lives on LL feature page 1, so the LL Extended
# Feature Set is required (host + controller). FSU also requires Extended Reject
# Indication (auto-selected by BT_CTLR_FRAME_SPACE_UPDATE). Unlike SCI there is
# no host feature-support bit (bit 65 is Host-Controlled = N), so no
# BT_CTLR_SET_HOST_FEATURE dance.
CONFIG_BT_LE_EXTENDED_FEAT_SET=y
CONFIG_BT_LE_MAX_LOCAL_SUPPORTED_FEATURE_PAGE=1
CONFIG_BT_CTLR_FRAME_SPACE_UPDATE=y
CONFIG_BT_CTLR_FSU_MIN_FRAME_SPACE_US=80
