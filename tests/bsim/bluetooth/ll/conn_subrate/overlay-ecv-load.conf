# Overlay for the ECV-under-ZMK-split-load floor scenario: composes Shorter
# Connection Intervals (the ECV 125 us interval tier) WITH Frame Space Update
# (the negotiated sub-150 us tIFS) in one controller build -- the load-bearing
# re-test of the empty-PDU floor sweep, and the airtime-vs-scheduler
# discriminator (the same load runs with and without the FSU negotiation).
# Both features live on LL feature page 1, so the Extended Feature Set is on.
CONFIG_BT_LE_EXTENDED_FEAT_SET=y
CONFIG_BT_LE_MAX_LOCAL_SUPPORTED_FEATURE_PAGE=1
CONFIG_BT_SHORTER_CONNECTION_INTERVALS=y
CONFIG_BT_FRAME_SPACE_UPDATE=y
CONFIG_BT_CTLR_FRAME_SPACE_UPDATE=y
CONFIG_BT_CTLR_FSU_MIN_FRAME_SPACE_US=80

# ECV floor at the Core 6.2 spec minimum (3 = 375 us), NOT the 625 us nRF54L15
# hardware floor overlay-sci.conf models: this scenario's informational probes
# deliberately step below the measured floor ({500, 375} us) to record where
# degradation happens on the idealized bsim radio, so the controller must
# accept the requests (all three enforcement sites -- the PDU codec, the HCI
# req_send check, and the peer-REQ acceptance -- key off this one symbol). The
# asserting gate stays {750, 625} us; the floor-vs-hardware question is the
# probes' data, not a production default (production keeps 5/625 us).
CONFIG_BT_CTLR_SCI_ECV_INTERVAL_MIN_125US=3

# Below the validated floor the ticker can decide an event would start late;
# skip it gracefully instead of asserting (the skip shows up as a delivered-
# rate shortfall, which is exactly what the gate's 90% floor and the probes'
# RESULT lines measure -- nothing is masked). Same relaxation the original
# floor-sweep spike used. BT_CTLR_ADVANCED_FEATURES makes the symbol visible;
# without it the =n assignment is silently dropped (menu "Advanced features",
# Kconfig.ll_sw_split). NOTE: the sub-625 us probes may still terminate in a
# prepare-pipeline / done-pool assert (the spike's CONFIG_BT_CTLR_EVENT_DONE_MAX
# pool tunable is not on this branch); their CI step is continue-on-error and
# an assert there is itself the recorded floor datum.
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n

# Host TX headroom for a sustained 1-notification-per-CE stream at sub-ms
# intervals (default is 3 ACL TX buffers; L2CAP/ATT counts follow this symbol).
# Backpressure would show as bt_gatt_notify -ENOMEM on the peripheral -- a rate
# shortfall, not a test error, but do not let host buffer sizing be the thing
# the scenario measures.
CONFIG_BT_BUF_ACL_TX_COUNT=8
