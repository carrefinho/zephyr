# Overlay STACKED on overlay-sci.conf (pass both to OVERLAY_CONFIG). It
# co-enables the Connected ISO (CIS) and Periodic Advertising Sync Transfer
# (PAST) controller code alongside SCI, so the ECV-reject guards added to those
# paths are COMPILED in CI with CONFIG_BT_CTLR_SHORTER_CONNECTION_INTERVALS on
# and do not silently bit-rot. Guard sites kept on the compile path:
#   - ll_cis_create_check        (ull_central_iso.c, CENTRAL_ISO)
#   - rp_cc_st_idle CIS_REQ       (ull_llcp_cc.c,     PERIPHERAL_ISO)
#   - ull_cp_periodic_sync        (ull_llcp.c,        SYNC_TRANSFER_SENDER)
#   - PAST receive handler        (ull_sync.c,        SYNC_TRANSFER_RECEIVER)
#
# Build-only: the conn_subrate app does not exercise ISO/PAST at runtime. The
# ECV floor's reduced-reservation timing assumes BT_CTLR_ADV_EXT=n; PAST forces
# EXT_ADV on, which changes the event-overhead regime -- irrelevant to a compile
# check, which is all this overlay is for. The runtime ECV scenarios run under
# overlay-sci.conf (no EXT_ADV) in the other steps.

# --- Connected ISO (CIS): central + peripheral controller roles ---
CONFIG_BT_ISO_CENTRAL=y
CONFIG_BT_ISO_PERIPHERAL=y
CONFIG_BT_CTLR_CENTRAL_ISO=y
CONFIG_BT_CTLR_PERIPHERAL_ISO=y
CONFIG_BT_CTLR_ISO_TX_BUFFER_SIZE=208
CONFIG_BT_CTLR_ISO_TX_SDU_LEN_MAX=200
CONFIG_BT_CTLR_ISO_TX_BUFFERS=4
CONFIG_BT_CTLR_ISOAL_SOURCES=2
CONFIG_BT_CTLR_ISOAL_SINKS=2
CONFIG_BT_CTLR_CONN_ISO_STREAMS_PER_GROUP=4

# --- Periodic Advertising Sync Transfer (PAST): sender + receiver ---
CONFIG_BT_EXT_ADV=y
CONFIG_BT_PER_ADV=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_PER_ADV_SYNC=y
CONFIG_BT_PER_ADV_SYNC_TRANSFER_RECEIVER=y
CONFIG_BT_PER_ADV_SYNC_TRANSFER_SENDER=y
