# Event-by-event prepare-pipeline trace (see strand_trace.h).
CONFIG_BT_CTLR_STRAND_TRACE=y

# Keep printk synchronous and in-order: with CONFIG_LOG=y printk is otherwise
# routed through the logging subsystem, which can reorder or drop output from
# ISR context - exactly the contexts being traced.
CONFIG_LOG_PRINTK=n
