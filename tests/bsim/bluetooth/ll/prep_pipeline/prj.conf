CONFIG_BT=y
CONFIG_LOG=y

# LL_ASSERT(next) must actually fire and abort (with file:line) when the prepare
# pipeline overflows - that abort is the reproduction signal.
CONFIG_ASSERT=y
CONFIG_ASSERT_VERBOSE=y
CONFIG_BT_ASSERT=y

CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_DEVICE_NAME="bsim_prep"

# The DUT holds two simultaneous links (host + split); 3 covers the shared binary.
CONFIG_BT_MAX_CONN=3

# Keep both links pinned at 7.5 ms: no peripheral-initiated ~5 s auto param
# update that would move the interval and de-correlate the two events.
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n

# Saturate both links: large host + controller buffer pools so the continuous
# write-without-response loops keep many PDUs queued per connection event, so
# each 7.5 ms event runs long enough that the DUT's two events cannot avoid
# overlapping (which drives the LL_SW preempt/duplicate-prepare path).
# Host-side ACL/L2CAP TX queueing so each event packs many PDUs (long events;
# the controller's ACL Tx draws from these). Zephyr 4.1 rules: ACL_RX_COUNT is
# deprecated (use *_EXTRA), and BT_BUF_EVT_RX_COUNT must exceed ACL_TX_COUNT.
CONFIG_BT_BUF_ACL_TX_COUNT=12
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=12
CONFIG_BT_L2CAP_TX_BUF_COUNT=16
CONFIG_BT_CONN_TX_MAX=12
CONFIG_BT_CTLR_RX_BUFFERS=16
