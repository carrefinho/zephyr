# Bisect-only overlay: compile out the controller's crypto hal (CCM/AAR).
# The nrfx CCM event enum names changed inside the v3.7.0..v4.0.0 bisect
# range (NRF_CCM_EVENT_ENDCRYPT et al.), so older controller subtrees fail
# to build against the v4.0.0 workspace's hal_nordic - but only in code the
# repro never runs: the test never pairs or encrypts. Disabling LE
# encryption + privacy removes the drift-coupled code from the build
# without touching the scheduling paths under bisection.
CONFIG_BT_CTLR_LE_ENC=n
CONFIG_BT_CTLR_PRIVACY=n
