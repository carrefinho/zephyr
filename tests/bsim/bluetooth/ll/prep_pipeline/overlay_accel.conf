# Accelerator overlay: shrink the prepare pipeline from 7 to 3 slots so the
# duplicate-prepare leak overflows in seconds instead of needing a long soak.
# Relies on the #ifndef guard added to ll_sw/lll.h. The bug is unchanged - only
# the headroom shrinks; the fix (93b951d + 0d1b4d2) still prevents overflow at
# this depth, so the A/B test stays valid. Confirm any overflow is the bug (not
# legitimate sizing) by checking the dumped pipeline for duplicate (same-param,
# different-ticks) entries, exactly as in the real coredump triage.
CONFIG_COMPILER_OPT="-DEVENT_PIPELINE_MAX=3"
