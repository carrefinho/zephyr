CONFIG_BT=y
CONFIG_LOG=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_PRIVACY=y
CONFIG_BT_SMP=y
CONFIG_BT_SIGNING=y
CONFIG_BT_BAS=y
CONFIG_BT_HRS=y
CONFIG_BT_ATT_PREPARE_COUNT=2
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_DEVICE_NAME="bsim_test_split_500u"
CONFIG_BT_L2CAP_TX_BUF_COUNT=6

CONFIG_BT_CTLR_PRIVACY=n

CONFIG_BT_CONN_PARAM_ANY=y

CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_CONN_INTERVAL_LOW_LATENCY=y

# A 500 us connection interval leaves less slack before the radio event start;
# disable the controller's event-overhead start assert so the single-timer
# nRF54L target does not assert when the prepare runs close to the event.
CONFIG_BT_CTLR_ASSERT_OVERHEAD_START=n

CONFIG_TEST_CONN_INTERVAL_500US=y
